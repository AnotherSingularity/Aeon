[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "aeon"
version = "0.2.2"
description = "Aeon hybrid: multi-input contractive Recursion over a recurrent substrate + Aeon-original Qwen2 backbone"
requires-python = ">=3.10"

# The architecture package `aeon/` is Aeon-original and depends only on torch +
# safetensors (weight I/O) + pyyaml. `transformers` is NOT a core dependency and
# does not appear in any import reachable from HybridModel.forward(); it is an
# optional, non-architecture dependency used only by the byte-identity gate
# (test) and the training script's tokenizer (train).
#
# NOTE: install torch from the CUDA 12.4 index first (see README):
#   pip install torch==2.5.1 --index-url https://download.pytorch.org/whl/cu124
dependencies = [
    "torch==2.5.1",
    "safetensors>=0.4,<1.0",
    "pyyaml>=6.0",
]

[project.optional-dependencies]
# transformers is confined to these extras (test-time gate + train-time
# tokenizer/data). It is never imported by the aeon architecture.
test = ["pytest>=8.0", "transformers==4.46.3"]
train = [
    "transformers==4.46.3",
    "datasets>=3.0,<4.0",
    "huggingface_hub>=0.25",
    "accelerate>=1.0,<2.0",
]

[tool.setuptools.packages.find]
include = ["aeon*"]
