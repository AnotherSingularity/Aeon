[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "aeon"
version = "0.2.3"
description = "Aeon: a multi-source contractive architecture — recurrent substrate + transformer side joined by a sigma<1 contractive Recursion. 100% Aeon-original."
requires-python = ">=3.10"

# Core dependencies only — generic libraries, nothing model-affiliated.
# torch from the CUDA 12.4 index (see README):
#   pip install torch==2.5.1 --index-url https://download.pytorch.org/whl/cu124
# safetensors: Aeon checkpoint I/O (generic tensor format). sentencepiece: the
# backend Aeon TRAINS ITS OWN 32k tokenizer with (scripts/train_tokenizer.py) —
# generic library, no model affiliation, nothing downloaded. No external model or
# architecture library appears here or on any forward path.
dependencies = [
    "torch==2.5.1",
    "safetensors>=0.4,<1.0",
    "sentencepiece>=0.2,<1.0",
    "pyyaml>=6.0",
    "numpy>=1.24",
]

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[tool.setuptools.packages.find]
include = ["aeon*"]
