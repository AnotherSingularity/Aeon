# E5 — Runtime & overhead certification config.
#
# Deliberately small so a bounded training scenario runs in seconds on a 4-thread
# laptop-class CPU, but preserves EVERY architectural invariant: matrix cell +
# adaptive feedback + K=16 slow clock + fp32 Recursion + certificate + single
# broadcast. Used ONLY for E5 certification (fresh init, instrumentation
# equivalence, save/stop/resume, offline diagnostics, cleanup) — never for the
# primary training run. The primary config is configs/aeon_350m.yaml.
model:
  h_rec: 32
  K: 16
  margin_h: 0.98
  margin_c: 0.95
  freeze_backbone: false
  use_embedding_input: true
  dtype: float32
  transformer:
    vocab_size: 128
    hidden_size: 64
    intermediate_size: 128
    num_hidden_layers: 2
    num_attention_heads: 4
    num_key_value_heads: 2
    head_dim: 16
    max_position_embeddings: 128
    rms_norm_eps: 1.0e-5
    rope_theta: 10000.0
    tie_word_embeddings: true
    attention_bias: false
  substrate:
    kind: matrix
    d_in: 32
    d_state: 32
    n_head: 2
    head_size: 16
    use_state_norm: false
    adaptive_feedback: true
    gate_alpha_init: 8.0
    gate_threshold_init: 0.5
    learn_gate: true

data:
  seq_len: 64
  tokenizer: null
  corpus: null

train:
  lr: 3.0e-4
  weight_decay: 0.1
  max_steps: 40                # multiple K=16 boundaries (64/16=4 per step × 40 = 160)
  batch_size: 1
  grad_clip: 1.0
  log_every: 5
  ckpt_every: 20
  out_dir: runs/aeon_e5
  resume: false                # scenario 1 (fresh); flip to true for scenario 6-7
  seed: 42
  aux_gate_penalty: 0.01
  sample_every: 8              # dense sampling to exercise the sampled path
  observability: true
