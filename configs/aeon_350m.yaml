# Aeon V0.02.03 — 350M multilingual from-scratch prototype config.
#
# Sized to ~350.0M trainable at the dimensions below. Only the vocab (and hence
# the tied I/O embedding) grew vs the earlier 251.7M build: everything-else is
# 218.94M unchanged; the 128k×1024 embedding is 131.07M. Everything random-
# initialized; the tokenizer is Aeon's own (scripts/train_tokenizer.py), 128k
# multilingual vocab (top-50 languages).
#
# To run a real corpus, set data.tokenizer to a trained .model and data.corpus to
# the text/jsonl corpus. With neither set, train.py falls back to a synthetic
# token source (pipeline smoke only).
model:
  h_rec: 512                 # substrate state / manifold width (d_s)
  K: 16                      # slow-clock window size
  margin_h: 0.98
  margin_c: 0.95
  freeze_backbone: false     # train the transformer side from scratch
  use_embedding_input: true  # 3rd Recursion input: window mean of raw embeddings
  dtype: bfloat16
  transformer:               # Aeon's architecture choices (350M target)
    vocab_size: 128000       # multilingual, matched to the from-scratch tokenizer
    hidden_size: 1024
    intermediate_size: 2048  # unchanged; everything-else stays 218.94M
    num_hidden_layers: 24
    num_attention_heads: 16
    num_key_value_heads: 4   # grouped-query attention
    head_dim: 64             # 16 × 64 = 1024
    max_position_embeddings: 8192
    rms_norm_eps: 1.0e-5
    rope_theta: 10000.0
    tie_word_embeddings: true
    attention_bias: false
  substrate:
    kind: matrix             # "matrix" | "vector"
    d_in: 512
    d_state: 512
    n_head: 8
    head_size: 64            # 8 × 64 = 512 = h_rec
    use_state_norm: false
    adaptive_feedback: true  # closed-loop load-sensing feedback control (feedback.py)
    gate_alpha_init: 8.0     # gate sharpness  g(L)=sigmoid(α·(L−θ))
    gate_threshold_init: 0.5 # gate centre θ (tune from observed load after early steps)
    learn_gate: true         # α, θ learned (fp32 master params, re-cast in train.py)

data:
  seq_len: 2048
  tokenizer: null            # path to Aeon tokenizer .model (null → synthetic tokens)
  corpus: null               # path to text/jsonl corpus  (null → synthetic tokens)

train:
  lr: 3.0e-4
  weight_decay: 0.1
  max_steps: 100000
  batch_size: 4
  grad_clip: 1.0
  log_every: 20              # audit: sigma values, gamma, loss
  ckpt_every: 1000
  out_dir: runs/aeon_350m
  resume: true
  seed: 0
