# Aeon V0.02.03 — PRIMARY training campaign config.
#
# Immutable per §13.1: this file names every dimension, precision rule,
# scheduling constant, and IO path for the from-scratch primary training run.
# Corpus + tokenizer paths are placeholders that MUST be set at launch time —
# never checked in with a live value, because the tokenizer identity is part of
# checkpoint compatibility.
#
# Scale: 350.28M trainable (matches configs/aeon_350m.yaml exactly). The only
# operational deltas from aeon_350m.yaml are:
#   * observability enabled with sparse sampling (§8.3)
#   * atomic checkpointing with strict resume (E3)
#   * explicit note that this config is versioned with the campaign
#
# DO NOT edit this file to change protected constants during a live campaign.
# The E1 config-invariant tests + the E3 strict_load metadata gate together
# ensure a checkpoint saved under one primary config cannot silently resume
# under a mutated one (K, vocab, patch manifest all cross-checked).

meta:
  campaign_version: "V0.02.03-primary-01"
  base_commit: "d40ee13 (V0.02.03 tip) + E0-E7 upgrade on claude/funny-cori-a3k5cf"
  note: "See docs/OPERATIONS.md for launch, resume, and recovery procedures."

model:
  h_rec: 512
  K: 16                       # §3.4 — locked
  margin_h: 0.98              # certificate MARGIN_H (structural)
  margin_c: 0.95              # certificate MARGIN_C (structural)
  freeze_backbone: false      # train the transformer side from scratch
  use_embedding_input: true   # 3rd Recursion input: window mean of raw embeddings
  dtype: bfloat16             # compute dtype; Recursion + γ + gate scalars stay fp32
  transformer:
    vocab_size: 128000        # matched to the Aeon multilingual tokenizer at launch
    hidden_size: 1024
    intermediate_size: 2048   # → 350.02M without adaptive feedback
    num_hidden_layers: 24
    num_attention_heads: 16
    num_key_value_heads: 4    # GQA
    head_dim: 64              # 16 × 64 = 1024
    max_position_embeddings: 8192
    rms_norm_eps: 1.0e-5
    rope_theta: 10000.0
    tie_word_embeddings: true
    attention_bias: false
  substrate:
    kind: matrix
    d_in: 512
    d_state: 512
    n_head: 8
    head_size: 64
    use_state_norm: false
    adaptive_feedback: true   # matrix-cell closed-loop control (P-sub-autonomy)
    gate_alpha_init: 8.0
    gate_threshold_init: 0.5  # tune from observed load after early steps
    learn_gate: true

data:
  seq_len: 2048
  # Both MUST be filled at launch. Never commit live paths.
  tokenizer: null             # e.g. /path/to/tokenizer/aeon.model
  corpus: null                # e.g. /path/to/aeon_corpus/

train:
  lr: 3.0e-4
  weight_decay: 0.1
  max_steps: 100000
  batch_size: 4
  grad_clip: 1.0
  log_every: 20               # always-on metrics cadence
  ckpt_every: 1000            # atomic save cadence
  out_dir: runs/aeon_350m_primary
  resume: true                # strict_load auto-selects latest valid ckpt if present
  seed: 0
  aux_gate_penalty: 0.01      # L_aux = β · mean g(L); §revision
  observability: true         # §8 permanent instrumentation
  sample_every: 512           # §8.3 sparse sampling cadence
